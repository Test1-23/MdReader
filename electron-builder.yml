appId: com.mdreader.app
productName: MdReader
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - assets/icon.png
  - package.json
  - "!node_modules/**"
asar: true
win:
  target: nsis
  icon: assets/icon.png
mac:
  target: dmg
  category: public.app-category.productivity
  icon: assets/icon.png
linux:
  target: AppImage
  icon: assets/icon.png
